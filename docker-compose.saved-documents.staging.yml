# Isolated staging infrastructure only. No init SQL or migration runs on startup.
# Provisioning the RAG schema requires a separately prepared fixture/authorization.
name: examflow-saved-documents-staging
services:
  questionbank:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: examflow_rag_staging
      POSTGRES_USER: examflow_rag_staging
      POSTGRES_PASSWORD: ${EXAMFLOW_RAG_STAGING_PASSWORD:?Set a dedicated staging-only password}
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - questionbank-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examflow_rag_staging -d examflow_rag_staging"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  questionbank-staging:
