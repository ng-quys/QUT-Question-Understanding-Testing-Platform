# STAGING ONLY. Load with spring.config.location, never config.additional-location.
# Intended for a document/auth-only integration fixture, not full Production boot.
spring.config.import=
spring.application.name=ExamFlow-SavedDocuments-Staging
server.address=127.0.0.1
server.port=18080
spring.datasource.url=jdbc:postgresql://127.0.0.1:55442/examflow_main_staging
spring.datasource.username=examflow_main_staging
spring.datasource.password=${EXAMFLOW_STAGING_MAIN_PASSWORD}
questionbank.datasource.url=jdbc:postgresql://127.0.0.1:55441/examflow_rag_staging
questionbank.datasource.username=examflow_rag_staging
questionbank.datasource.password=${EXAMFLOW_STAGING_QB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.jpa.open-in-view=false
