ai.saved-documents.enabled=true
ai.rag.url=http://127.0.0.1:18002
ai.internal.key=${EXAMFLOW_STAGING_INTERNAL_KEY}
ai.ollama.url=http://127.0.0.1:11434
ai.ollama.model=qwen2.5:7b
SUPABASE_URL=${EXAMFLOW_STAGING_STORAGE_URL}
