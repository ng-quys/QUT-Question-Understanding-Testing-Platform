# PROPOSAL: not launched; no init SQL and no implicit schema creation.
name: examflow-saved-documents-main-staging
services:
  main:
    image: postgres:17
    environment:
      POSTGRES_DB: examflow_main_staging
      POSTGRES_USER: examflow_main_staging
      POSTGRES_PASSWORD: ${EXAMFLOW_STAGING_MAIN_PASSWORD:?Set a new staging-only password}
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - main-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examflow_main_staging -d examflow_main_staging"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  main-staging:
