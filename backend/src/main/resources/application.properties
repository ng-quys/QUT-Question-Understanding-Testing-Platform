spring.application.name=backend

# Supabase PostgreSQL - Session Pooler
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.kbplrzkjnyphsbdmscgq
spring.datasource.password=${DB_PASSWORD}

# Database schema da duoc tao san tren Supabase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8080
# ExamFlow API token (override in production)
app.auth.token-secret=${APP_TOKEN_SECRET:examflow-dev-secret-change-me}
app.auth.token-ttl-seconds=28800

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Student face profile storage. Shared with the Python anti-cheating service when the repo is colocated.
app.student-profile-dir=../anti-cheating/student-profiles

# Anti-Cheating integration
app.anticheat.url=${ANTICHEAT_SERVICE_URL:http://127.0.0.1:8000}
app.anticheat.secret=${ANTICHEAT_INTERNAL_SECRET:change-me}
app.student-profile-dir=${STUDENT_PROFILE_DIR:../anticheating/student-profiles}
